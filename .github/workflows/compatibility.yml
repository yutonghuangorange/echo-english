name: Cross-platform compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-15-intel
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # The Windows launcher also enables UTF-8 for Chinese paths and messages.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies (no models or PyTorch)
        run: |
          npm ci
          python -m pip install "numpy<2" "soundfile>=0.12,<0.14"
          python -m pip check
      - name: Test extension and native platform launcher
        run: npm test
      - name: Test service, model management and audio stitching
        run: python -m unittest discover -s karaoke -p "test_*.py"
