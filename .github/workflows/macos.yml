name: macOS compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install native dependencies
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then brew install ffmpeg; fi
          python -m venv .venv
          .venv/bin/python -m pip install -r karaoke/requirements.txt
          .venv/bin/python -m pip check
          npm ci
      - name: Test extension, native Bash 3.2 installer and service
        run: |
          /bin/bash --version
          /bin/bash -n start-karaoke.sh karaoke/setup-and-start.sh karaoke/start.sh
          npm test
          .venv/bin/python -m unittest discover -s karaoke -p 'test_*.py'
      - name: Separate synthetic audio with the production CPU worker
        run: .venv/bin/python karaoke/smoke_test.py --launcher
